schema_name: product-target-manifest
schema_version: "1.0.0"
additional_properties: false
required_fields:
  - manifest_version
  - target
  - authority_surface
  - mode
accepted_manifest_versions:
  - "1.0"

target:
  additional_properties: false
  required_fields:
    - source_type
    - repo
    - commit
  allowed_source_types:
    - local_git
    - github
  commit_format: "^[0-9a-fA-F]{40}$"
  commit_normalization: lowercase
  repo_formats:
    github: "^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$"
    local_git: "^(?!(?:[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$|[a-zA-Z][a-zA-Z0-9+.-]*://|git@)).+$"

authority_surface:
  additional_properties: false
  required_fields:
    - include
  optional_fields:
    - exclude
  disallow_absolute_paths: true
  disallow_parent_traversal: true
  path_separator: "/"
  unsupported_glob_characters: "[]{}!~^"

mode:
  additional_properties: false
  required_fields:
    - read_only
  required_values:
    read_only: true