schema_name: target-manifest
schema_version: "1.0.0"

required_sections:
  - target
  - authority_surface
  - baseline
  - mode

target:
  required_fields:
    - source_type
    - repo
    - commit
  allowed_source_types:
    - local_git
    - github
  commit_format: "^[0-9a-fA-F]{40}$"

authority_surface:
  required_fields:
    - include
  optional_fields:
    - exclude
  disallow_absolute_paths: true
  disallow_parent_traversal: true
  path_separator: "/"

baseline:
  required_fields:
    - framework
    - version
  allowed_frameworks:
    - NIST_SP_800_218
  allowed_versions:
    NIST_SP_800_218:
      - "1.1"

mode:
  required_fields:
    - read_only
  required_values:
    read_only: true
